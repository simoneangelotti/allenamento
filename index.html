<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#122720"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Allenamento"><title>Allenamento funzionale 1.4</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:#eaf0ed;background:#101715;color-scheme:dark;--surface:#1b2521;--stroke:#33433b;--accent:#b4e1c6;--text:#eaf0ed;--muted:#a2b2a9}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#101715;-webkit-tap-highlight-color:transparent}header{padding:23px 20px 17px;background:#17211d;position:sticky;top:0;z-index:4;border-bottom:1px solid #2d3a33}h1{font-size:23px;letter-spacing:-.65px;margin:0 0 5px;font-weight:750}h2{font-size:21px;letter-spacing:-.5px;margin:12px 0 17px}h3{font-size:16px;margin:0 0 10px;letter-spacing:-.2px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.wrap{padding:20px 16px;max-width:650px;margin:auto}.tabs{display:flex;gap:7px;overflow-x:auto;padding:11px 16px 13px;background:#17211d;scrollbar-width:none;position:sticky;top:76px;z-index:3;border-bottom:1px solid #2d3a33}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;white-space:nowrap;font-size:13px;padding:10px 14px;min-height:39px;background:transparent;color:#b8c7be;border:1px solid #35443c;border-radius:999px;box-shadow:none}.tabs button.active{background:var(--accent);border-color:var(--accent);color:#13231a;font-weight:750}.card{background:var(--surface);border:1px solid var(--stroke);border-radius:19px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #00000010}.line{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{font-size:12px;background:#2a4235;color:#d4f3df;padding:7px 10px;border-radius:999px;white-space:nowrap}button,.btn{font:inherit;border:1px solid transparent;background:var(--accent);color:#13231a;border-radius:13px;padding:12px 17px;min-height:45px;font-weight:700;cursor:pointer;letter-spacing:-.1px;transition:background .15s ease,transform .12s ease,border-color .15s ease;box-shadow:none}button:active{transform:scale(.97)}button.secondary,.btn.secondary{background:#304239;color:#eef6f0;border-color:#3c5547}button.outline{background:transparent;border:1px solid #647f6e;color:#e5f3e9}button:disabled{opacity:.42;cursor:not-allowed}input,select,textarea{font:inherit;background:#121c17;color:#f1f7f3;border:1px solid #4b6254;border-radius:12px;padding:12px;width:100%;min-width:0;min-height:44px}textarea{resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid #b4e1c633}label{font-size:13px;color:#c0d0c5;display:block;margin:12px 0 6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.ex{border-top:1px solid #33443a;padding:19px 0}.ex:first-child{border-top:0;padding-top:5px}.ex .line b{font-size:15px;line-height:1.4}.sets{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,.72fr) 46px;gap:7px;align-items:center;margin:10px 0}.sets input{padding:9px;font-size:14px}.sets button{padding:7px;min-height:44px;font-size:19px}.small{font-size:12px}.hidden{display:none}a{color:#b8edce;text-underline-offset:3px}details{margin-top:12px}summary{cursor:pointer;padding:8px 0}.stat{font-size:27px;font-weight:750;letter-spacing:-.6px}.notice{border-left:3px solid #d6bd7e;padding:13px 14px;background:#29291f;border-radius:9px;font-size:13px;line-height:1.6}.bottom{height:54px}.timerbar{position:sticky;bottom:0;z-index:5;background:#25392e;border-top:1px solid #56705f;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -5px 20px #0003}.timerbar button{padding:8px 11px;min-height:38px}.tiny{font-size:12px}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:9px 2px;text-align:center;border:1px solid #3b4d41;border-radius:10px;font-size:12px;min-height:45px}.day.done{background:#315b45;border-color:#51896a}.day.today{outline:2px solid var(--accent);outline-offset:1px}.hint{background:#253a2e;color:#cfe5d6;padding:13px;border-radius:12px;margin-top:12px;font-size:13px;line-height:1.5}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #d5f8df;outline-offset:2px}.check{background:#b4e1c6!important;color:#11251a!important}p{line-height:1.6}ul{line-height:1.7;padding-left:20px}@media(max-width:380px){.wrap{padding:14px 12px}.card{padding:14px}.tabs{padding-left:12px}.sets{gap:5px}.sets input{padding:7px}}
.quality{padding:12px 0 14px;border-top:1px solid var(--stroke);margin-top:12px}.quality select{width:100%;margin-top:6px}.quality .small{margin-top:7px} </style></head><body><header><h1>Allenamento funzionale</h1><div class="muted">Il tuo percorso · 3 sedute/settimana · 4 settimane</div></header><nav class="tabs"><button onclick="show('home')">Oggi</button><button onclick="show('session')">Scheda</button><button onclick="show('history')">Diario</button><button onclick="show('calendar')">Calendario</button><button onclick="show('food')">Alimentazione</button><button onclick="show('settings')">Dati</button></nav><main class="wrap" id="app"></main><div id="timer" class="timerbar hidden"></div><script>
const KEY='fitness_personale_v1';let state={sessions:[],measurements:[],week:1};let storageMode='inizializzazione',storageReady=false;let page='home',type='A',draft={},timerUntil=0,timerInterval=null;const REST_SECONDS=90;const workouts={A:{name:'Forza e tecnica',warm:'8–10 minuti: mobilità dinamica, attivazione del tronco e 1–2 serie molto leggere dei movimenti principali.',cool:'5–10 minuti di camminata e mobilità dolce.',items:[['Goblet squat','3','8–10','','Scendi con controllo e mantieni il tronco stabile. Alternativa: squat a corpo libero o con manubrio.','goblet squat kettlebell form','Tecnica prima del carico; lascia 2–3 ripetizioni di margine.'],['Stacco da terra con manubri o kettlebell','3','6–8','','Parti con carico gestibile; muovi le anche senza arrotondare la schiena. Bilanciere solo quando disponibile e con tecnica stabile.','dumbbell deadlift hip hinge tutorial','Non aumentare il peso se perdi la posizione lombare.'],['Military press con manubri','3','6–8','','In piedi con addome attivo, senza slancio né inarcamento; alternativa: press a un braccio con kettlebell leggero.','strict dumbbell overhead press form','Se inizi a compensare, interrompi la serie o alleggerisci.'],['Rematore con manubrio in appoggio','3','8–10 per lato','','Appoggiati a una superficie stabile; in palestra puoi usare il bilanciere, evitando oscillazioni del tronco.','supported one arm dumbbell row form','Tieni ferme le spalle e non ruotare il busto.'],['Dead bug','3','8 per lato','0','Respira e mantieni il tronco stabile; riduci l’ampiezza se perdi il controllo.','dead bug exercise technique','Movimento lento e preciso.'],['Farmer carry','3','30–40 secondi','','Cammina con manubri o kettlebell, busto alto, senza inclinarti.','farmer carry dumbbell technique','Meglio leggero e stabile che pesante e sbilanciato.']]},B:{name:'Corsa aerobica',warm:'5–10 minuti di camminata veloce e mobilità dinamica.',cool:'5–10 minuti di camminata e mobilità leggera.',items:[['Corsa facile','1','35–45 minuti','0','Ritmo conversazionale: dovresti riuscire a parlare in frasi complete.','easy running conversational pace','Non cercare il passo migliore.'],['Mobilità e recupero','1','10 minuti','0','Mobilità dolce di anche, torace e caviglie, senza dolore.','mobility routine for runners','Evita allungamenti forzati.']]},C:{name:'Funzionale controllato',warm:'10 minuti: mobilità e prove leggere degli esercizi; non iniziare già affaticato.',cool:'5–10 minuti di camminata e mobilità dolce.',items:[['Step-up basso','3','8 per gamba','0','Gradino stabile; controlla la discesa. Alternativa: split squat assistito.','low step up exercise technique','Mantieni il ginocchio allineato.'],['Piegamenti','3','8–12','0','Corpo allineato; aumenta l’inclinazione se perdi la tecnica.','push up proper form','Interrompi prima del cedimento.'],['Trazioni assistite','3','2–5','0','Usa un elastico o supporto se necessario; alternativa: rematore con manubri.','assisted pull up proper form','Non forzare ripetizioni incomplete.'],['Kettlebell deadlift','3','8–10','','Movimento d’anca controllato. Solo se il gesto è solido valuta in futuro lo swing, non come finisher sotto fatica.','kettlebell deadlift technique','Nessuna accelerazione necessaria.'],['Floor press con manubri','3','8–10','','Controlla discesa e salita senza rimbalzi.','dumbbell floor press proper form','Lascia 2–3 ripetizioni disponibili.'],['Side plank','2','20–30 secondi/lato','0','Mantieni spalla, bacino e caviglie allineati; ginocchia a terra se serve.','side plank form','La qualità vale più della durata.']]} };
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('IndexedDB non disponibile'));let req=indexedDB.open('allenamento_iphone_db',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('records'))req.result.createObjectStore('records')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('Apertura DB fallita'));req.onblocked=()=>reject(Error('Database bloccato'))})}
async function dbRead(){let db=await openDB();return new Promise((resolve,reject)=>{let tx=db.transaction('records','readonly'),r=tx.objectStore('records').get(KEY);r.onsuccess=()=>resolve(r.result??null);r.onerror=()=>reject(r.error);tx.oncomplete=()=>db.close();tx.onerror=()=>reject(tx.error)})}
async function dbWrite(value){let db=await openDB();await new Promise((resolve,reject)=>{let tx=db.transaction('records','readwrite');tx.objectStore('records').put(value,KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('Transazione annullata'))});db.close();let check=await dbRead();if(check!==value)throw Error('Verifica IndexedDB fallita')}
function valid(x){return x&&Array.isArray(x.sessions)&&Array.isArray(x.measurements)}
async function initStorage(){let old=null;try{old=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}try{let existing=await dbRead();if(typeof existing==='string'){let parsed=JSON.parse(existing);if(valid(parsed))state=parsed}else if(valid(old)){state=old;await dbWrite(JSON.stringify(state))}storageMode='IndexedDB'}catch(e){storageMode='localStorage';if(valid(old))state=old;try{localStorage.setItem('__allenamento_test','ok');if(localStorage.getItem('__allenamento_test')!=='ok')throw Error('Test lettura fallito');localStorage.removeItem('__allenamento_test')}catch(err){storageMode='non disponibile'}}storageReady=true;render()}
let saving=false;async function save(){if(!storageReady||saving){alert('Archivio occupato, riprova.');return false}saving=true;let serialized=JSON.stringify(state);try{if(storageMode==='IndexedDB')await dbWrite(serialized);else if(storageMode==='localStorage'){localStorage.setItem(KEY,serialized);if(localStorage.getItem(KEY)!==serialized)throw Error('Verifica localStorage fallita')}else throw Error('Memoria non disponibile');saving=false;return true}catch(e){saving=false;alert('ATTENZIONE: dati NON salvati. '+(e.message||e)+'\nEsporta un backup se hai dati importanti.');return false}}
function show(p){page=p;render();scrollTo(0,0)}function start(t){type=t;draft={};show('session')}function datestr(d=new Date()){return d.toLocaleDateString('it-IT')}function isoDay(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function dateOf(s){if(s.timestamp)return new Date(s.timestamp);if(s.isoDate)return new Date(s.isoDate+'T12:00:00');let m=String(s.date||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?new Date(+m[3],+m[2]-1,+m[1]):null}function latestFor(t,i){for(let s of [...state.sessions].reverse()){if(s.type!==t)continue;let entries=Object.entries(s.sets||{}).filter(([k,v])=>Number(k.split('-')[0])===i&&v&&v.done);if(entries.length)return {s,entries}}return null}function advice(t,i){let prev=latestFor(t,i);if(!prev)return 'Prima seduta: scegli un carico leggero e mantieni 2–3 ripetizioni di margine.';let v=prev.entries.map(([k,x])=>`${esc(x.reps||'—')} rip. · ${esc(x.kg||'0')} kg`).join(' / ');let q=prev.s.sets?.['quality-'+i];return `Ultima volta (${esc(prev.s.date)}): ${v}. Qualità: ${q==='clean'?'pulita':q==='compensation'?'con compensazioni':q==='poor'?'deteriorata':'non registrata'}. ${q==='poor'||q==='compensation'?'Riduci carico o ripetizioni e privilegia la tecnica.':'Non aumentare automaticamente il peso; progredisci solo se il movimento resta pulito.'}`}function startTimer(seconds=REST_SECONDS){timerUntil=Date.now()+seconds*1000;if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(updateTimer,250);updateTimer()}function stopTimer(){timerUntil=0;if(timerInterval)clearInterval(timerInterval);timerInterval=null;updateTimer()}function updateTimer(){let el=document.getElementById('timer');if(!el)return;if(!timerUntil){el.classList.add('hidden');return}let left=Math.max(0,Math.ceil((timerUntil-Date.now())/1000));el.classList.remove('hidden');el.innerHTML=`<span><b>Recupero</b> <span style="font-variant-numeric:tabular-nums">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span></span><button class="secondary" onclick="startTimer(60)">1′</button><button class="secondary" onclick="startTimer(120)">2′</button><button onclick="stopTimer()">Stop</button>`;if(left===0){stopTimer();if(navigator.vibrate)navigator.vibrate([150,100,150])}}function render(){let html='';if(page==='home'){const n=state.sessions.length;html=`<div class="card"><div class="muted">IL TUO PERCORSO</div><h2>Forza, resistenza e tecnica</h2><div class="grid"><div><div class="stat">${n}</div><div class="muted">Sedute registrate</div></div><div><div class="stat">${state.week}/4</div><div class="muted">Settimana impostata</div></div></div><p class="notice">Zona lombare sensibile ai carichi elevati: lavora con margine (circa 2–3 ripetizioni disponibili), evita dolore e non cercare massimali. Se compaiono sintomi persistenti, confrontati con un professionista sanitario.</p></div><h2>Scegli la seduta</h2>${Object.keys(workouts).map(t=>`<div class="card line"><div><b>${t} · ${workouts[t].name}</b><div class="muted">${t==='B'?'Corsa facile e mobilità':'Forza, controllo e stabilità'}</div></div><button onclick="start('${t}')">Apri</button></div>`).join('')}<p class="muted">Suggerimento: A – riposo – B – riposo – C. Nella settimana 1 usa carichi conservativi e cura la tecnica. Per esercizi tecnici interrompi la serie quando il movimento si deteriora. La progressione va adattata ai sintomi e al recupero.</p>`}if(page==='session'){let w=workouts[type];html=`<div class="line"><h2>${type} · ${w.name}</h2><select style="width:100px" onchange="type=this.value;draft={};render()">${Object.keys(workouts).map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select></div><div class="card"><b>Riscaldamento</b><p>${w.warm}</p></div><div class="card"><h3>Esercizi nell'ordine</h3>${w.items.map((e,i)=>`<section class="ex"><div class="line"><b>${i+1}. ${e[0]}</b><span class="pill">${e[1]} × ${e[2]}</span></div><p class="muted">${e[4]}</p><div class="hint"><b>Focus tecnico:</b> ${e[6]||'Movimento controllato.'}</div><div class="hint">${advice(type,i)}</div><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[5])}" target="_blank" rel="noopener">▶ Apri tutorial su YouTube (ricerca)</a><div class="small muted" style="margin-top:9px">Registra ogni serie: ripetizioni (o minuti/secondi per gli esercizi a tempo) e kg per singolo manubrio, se usato.</div><div class="quality"><label>Qualità tecnica</label><select aria-label="Qualità tecnica ${e[0]}" onchange="setQuality(${i},this.value)"><option value="" ${!draft['quality-'+i]?'selected':''}>Non valutata</option><option value="clean" ${draft['quality-'+i]==='clean'?'selected':''}>Pulita e controllata</option><option value="compensation" ${draft['quality-'+i]==='compensation'?'selected':''}>Qualche compensazione</option><option value="poor" ${draft['quality-'+i]==='poor'?'selected':''}>Tecnica deteriorata</option></select><div class="small muted">${draft['quality-'+i]==='poor'?'Interrompi o alleggerisci: non progredire col carico.':draft['quality-'+i]==='compensation'?'Ripeti con carico inferiore o meno ripetizioni.':draft['quality-'+i]==='clean'?'Buon controllo: consolida prima di aumentare.':'Registra la qualità dopo l’esercizio.'}</div></div>${Array.from({length:Number(e[1])},(_,j)=>{let k=i+'-'+j;let v=draft[k]||{};return `<div class="sets"><span class="muted">${j+1}.</span><input aria-label="Ripetizioni o durata serie ${j+1}" placeholder="Rip/durata" value="${esc(v.reps??'')}" oninput="change('${k}','reps',this.value)"><input type="number" min="0" step="0.5" aria-label="Chilogrammi serie ${j+1}" placeholder="kg" value="${esc(v.kg??e[3])}" oninput="change('${k}','kg',this.value)"><button class="${v.done?'check':'secondary'}" onclick="toggle('${k}')">${v.done?'✓':'○'}</button></div>`}).join('')}</section>`).join('')}</div><div class="card"><b>Defaticamento</b><p>${w.cool}</p><label>Difficoltà percepita (1–10)</label><select id="rpe">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${i===5?'selected':''}>${i+1}</option>`).join('')}</select><label>Note (schiena, ginocchio, energia, tempo di corsa)</label><textarea id="notes" rows="3" placeholder="Come è andata?"></textarea><button style="width:100%;margin-top:14px" onclick="finish()">Salva seduta</button></div>`}if(page==='calendar'){let now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),1),days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),offset=(start.getDay()+6)%7;let groups={};for(let s of state.sessions){let d=dateOf(s);if(!d)continue;let k=isoDay(d);(groups[k]??=[]).push(s.type)}html=`<h2>Calendario allenamenti</h2><div class="card"><b>${now.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</b><p class="muted">Giorni verdi = sedute salvate. Obiettivo: 3 sedute settimanali, con recupero tra le sedute di forza.</p><div class="weekdays">${['L','M','M','G','V','S','D'].map(x=>`<b class="tiny" style="text-align:center">${x}</b>`).join('')}${Array.from({length:offset},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>{let d=new Date(now.getFullYear(),now.getMonth(),i+1),k=isoDay(d),t=groups[k]||[];return `<div class="day ${t.length?'done':''} ${k===isoDay(now)?'today':''}"><b>${i+1}</b><div>${t.join(' ')}</div></div>`}).join('')}</div></div><div class="card"><b>Proposta settimanale</b><p>Lunedì A · Mercoledì B · Venerdì C, oppure tre giorni compatibili con i tuoi impegni. Non recuperare sedute saltate tutte insieme.</p><p class="muted">Questo calendario registra le sedute svolte; non invia notifiche. Per promemoria automatici usa Promemoria di iOS.</p></div>`} if(page==='history'){html=`<h2>Diario allenamenti</h2>${state.sessions.length?state.sessions.slice().reverse().map(s=>`<div class="card"><div class="line"><b>${esc(s.type)} · ${esc(workouts[s.type]?.name)}</b><span class="muted">${esc(s.date)}</span></div><p class="muted">Difficoltà ${esc(s.rpe)}/10 · ${Object.values(s.sets).filter(x=>x&&x.done).length} serie segnate</p>${s.notes?`<p>${esc(s.notes)}</p>`:''}<details><summary>Dettaglio serie e tecnica</summary>${Object.entries(s.sets).filter(([k,v])=>k.startsWith('quality-')&&v).map(([k,v])=>`<div class="small">${esc(workouts[s.type]?.items[Number(k.split('-')[1])]?.[0]||'Esercizio')}: ${v==='clean'?'Tecnica pulita':v==='compensation'?'Compensazioni':v==='poor'?'Tecnica deteriorata':'Non valutata'}</div>`).join('')}${Object.entries(s.sets).filter(([k,v])=>v&&v.done).map(([k,v])=>`<div class="small">${esc(workouts[s.type].items[Number(k.split('-')[0])][0])}: ${esc(v.reps||'—')} · ${esc(v.kg||'0')} kg</div>`).join('')}</details></div>`).join(''):'<div class="card">Non hai ancora salvato sedute.</div>'}<h2>Misurazioni</h2>${state.measurements.slice().reverse().map(m=>`<div class="card line"><span>${esc(m.date)}</span><b>${esc(m.weight)} kg</b><span>${esc(m.waist||'—')} cm vita</span></div>`).join('')}`;}if(page==='food'){html=`<h2>Alimentazione sostenibile</h2><div class="card"><b>Indicazioni, non dieta clinica</b><p>Non serve introdurre la colazione se stai bene senza. A mensa: una porzione adeguata di proteine, verdura, pane secondo fame e attività; considera che i sughi ricchi aumentano l'energia del piatto.</p><p>A cena: alterna carne, pesce, uova e legumi, aggiungi verdure e carboidrati soprattutto quando ti alleni. Uno yogurt greco/skyr e un frutto sono uno spuntino facoltativo.</p><p>Proteine: riferimento indicativo 125–145 g al giorno, da personalizzare. Evita tagli calorici aggressivi; monitora l'andamento di peso e vita per 2–3 settimane.</p><p>Bevande zero: apporto calorico generalmente trascurabile. Limita l'alcol e cura idratazione e sonno.</p></div><div class="card"><h3>Registra una misurazione</h3><label>Peso (kg)</label><input id="weight" type="number" step="0.1" min="20" placeholder="90"><label>Circonferenza vita (cm), facoltativa</label><input id="waist" type="number" step="0.1" min="30" placeholder="Misura sempre nello stesso punto"><button style="margin-top:12px" onclick="measure()">Salva misurazione</button></div>`}if(page==='settings'){html=`<h2>Dati e sicurezza</h2><div class="card"><b>Archivio: ${esc(storageMode)}</b><p class="muted">Ogni salvataggio viene riletto e verificato. Se fallisce, compare un avviso. Prova a chiudere e riaprire la pagina per verificare la persistenza tra sessioni.</p></div><div class="card"><p>I dati sono salvati <b>solo su questo dispositivo, nell'archivio del sito</b>. Non vengono inviati a un server. Se cancelli i dati del sito, potresti perderli: esporta regolarmente un backup.</p><label>Settimana corrente</label><select onchange="state.week=Number(this.value);save().then(ok=>{if(ok)render()})">${[1,2,3,4].map(x=>`<option value="${x}" ${x===state.week?'selected':''}>${x}</option>`).join('')}</select><p class="muted">1: familiarizzazione; 2: avvicinati alle serie previste; 3: aumenta lievemente le ripetizioni se ben tollerate; 4: consolida senza massimali.</p><button onclick="backup()">Esporta backup JSON</button> <label class="btn secondary" style="display:inline-block;color:white;cursor:pointer">Importa backup<input type="file" accept="application/json" onchange="restore(event)" style="display:none"></label></div><div class="card"><h3>Installazione iPhone</h3><p>Per usarla come app, pubblica questa pagina su un sito HTTPS, aprila con Safari e scegli Condividi → Aggiungi alla schermata Home. Aprire un file HTML locale non garantisce la conservazione dei dati.</p><p class="muted">Versione 1.4: programma rivisto, qualità tecnica per esercizio, calendario, timer e confronto con la seduta precedente. Le dimostrazioni aprono ricerche YouTube: non sono video singoli verificati. Per notifiche usa Promemoria di iOS.</p></div><div class="card"><button class="outline" onclick="if(confirm('Eliminare tutti i dati salvati?')){(async()=>{let prior=state;state={sessions:[],measurements:[],week:1};if(await save())render();else state=prior})()}">Elimina tutti i dati</button></div>`}document.getElementById('app').innerHTML=html+'<div class="bottom"></div>';document.querySelectorAll('.tabs button').forEach((b,i)=>{let pages=['home','session','history','calendar','food','settings'];b.classList.toggle('active',pages[i]===page);if(pages[i]===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}function setQuality(i,value){draft['quality-'+i]=value;let rpe=document.getElementById('rpe')?.value,notes=document.getElementById('notes')?.value;render();if(rpe&&document.getElementById('rpe'))document.getElementById('rpe').value=rpe;if(notes&&document.getElementById('notes'))document.getElementById('notes').value=notes}function change(k,f,v){draft[k]??={};draft[k][f]=v}function toggle(k){draft[k]??={};draft[k].done=!draft[k].done;if(draft[k].done)startTimer();let rpe=document.getElementById('rpe')?.value,notes=document.getElementById('notes')?.value;render();if(rpe&&document.getElementById('rpe'))document.getElementById('rpe').value=rpe;if(notes&&document.getElementById('notes'))document.getElementById('notes').value=notes}async function finish(){if(!Object.values(draft).some(x=>x.done)){alert('Segna almeno una serie completata prima di salvare.');return}state.sessions.push({date:datestr(),isoDate:isoDay(new Date()),timestamp:Date.now(),type,sets:JSON.parse(JSON.stringify(draft)),rpe:document.getElementById('rpe').value,notes:document.getElementById('notes').value});if(await save()){draft={};show('history')}else state.sessions.pop()}async function measure(){const weight=document.getElementById('weight').value,waist=document.getElementById('waist').value;if(!weight||Number(weight)<=0){alert('Inserisci un peso valido');return}state.measurements.push({date:datestr(),isoDate:isoDay(new Date()),timestamp:Date.now(),weight,waist});if(await save())show('history');else state.measurements.pop()}function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='allenamento-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restore(e){let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.sessions)||!Array.isArray(x.measurements))throw Error();if(confirm('Sostituire tutti i dati con questo backup?')){let prior=state;state=x;if(await save())show('home');else state=prior}}catch(e){alert('File di backup non valido')}}initStorage();
