<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#122720"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Allenamento"><title>Allenamento funzionale</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eaf3ed;background:#0e1915}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{padding:22px 18px 14px;background:#122720;position:sticky;top:0;z-index:2;border-bottom:1px solid #345047}h1{font-size:23px;margin:0 0 4px}h2{font-size:20px;margin:10px 0 14px}h3{font-size:16px;margin:0 0 8px}.muted{color:#a5b8ae;font-size:13px}.wrap{padding:16px;max-width:650px;margin:auto}.tabs{display:flex;gap:6px;overflow:auto;padding:12px 16px;background:#122720}.tabs button{flex:1;white-space:nowrap}.card{background:#1b3028;border:1px solid #365447;border-radius:16px;padding:16px;margin-bottom:12px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:12px;background:#2e5544;padding:5px 9px;border-radius:20px}button,.btn{font:inherit;border:0;background:#3caa7b;color:#071b12;border-radius:10px;padding:11px 14px;font-weight:650;cursor:pointer}button.secondary{background:#314a40;color:#eaf3ed}button.outline{background:transparent;border:1px solid #668b77;color:#d7eee1}button:disabled{opacity:.4}.tabs button{font-size:13px;padding:9px 11px}input,select,textarea{font:inherit;background:#10231b;color:#fff;border:1px solid #567364;border-radius:9px;padding:11px;width:100%;min-width:0}label{font-size:13px;color:#b9cfc1;display:block;margin:8px 0 5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ex{border-top:1px solid #3a5648;padding:14px 0}.ex:first-child{border-top:0}.sets{display:grid;grid-template-columns:35px 1fr 1fr 48px;gap:7px;align-items:center;margin:8px 0}.sets input{padding:8px}.sets button{padding:9px}.small{font-size:12px}.hidden{display:none}a{color:#9fe4bb}details{margin-top:8px}.stat{font-size:24px;font-weight:700}.notice{border-left:3px solid #d6bd7e;padding:9px 12px;background:#302d21;border-radius:5px;font-size:13px;line-height:1.5}.bottom{height:40px}button:focus-visible,input:focus-visible{outline:2px solid #e5f4e9} .check{background:#6fe0a6!important}p{line-height:1.5}ul{line-height:1.65;padding-left:20px}
</style></head><body><header><h1>Allenamento funzionale</h1><div class="muted">Il tuo percorso · 3 sedute/settimana · 4 settimane</div></header><nav class="tabs"><button onclick="show('home')">Oggi</button><button onclick="show('session')">Scheda</button><button onclick="show('history')">Diario</button><button onclick="show('food')">Alimentazione</button><button onclick="show('settings')">Dati</button></nav><main class="wrap" id="app"></main><script>
const KEY='fitness_personale_v1';let state={sessions:[],measurements:[],week:1};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}let page='home',type='A',draft={};const workouts={A:{name:'Forza generale',warm:'10 minuti: camminata sul posto, mobilità anche/spalle e 1 serie facile di squat e piegamenti.',cool:'5–10 minuti di camminata tranquilla e mobilità dolce.',items:[['Squat a corpo libero','3','10','0','Piedi stabili, movimento controllato; interrompi se compare dolore.','bodyweight squat proper form'],['Piegamenti','3','8-12','0','Corpo allineato; lascia 3–4 ripetizioni di margine.','push up proper form'],['Rematore con manubrio in appoggio','3','10 per lato','','Appoggia una mano a un supporto stabile; evita torsioni lombari.','supported one arm dumbbell row form'],['Ponte glutei','3','12','0','Solleva il bacino senza iperestendere la schiena.','glute bridge exercise proper form'],['Dead bug','3','8 per lato','0','Mantieni la zona lombare stabile e respira.','dead bug exercise technique'],['Side plank','2','20-30 secondi/lato','0','Allinea spalla, bacino e caviglie; puoi piegare le ginocchia.','side plank form']]},B:{name:'Corsa aerobica',warm:'5–10 minuti di camminata veloce e mobilità dinamica.',cool:'10–15 minuti di camminata e mobilità leggera.',items:[['Corsa facile','1','35–40 minuti','0','Ritmo conversazionale, senza inseguire il passo. Se necessario alterna corsa e camminata.','easy running conversational pace'],['Mobilità dolce','1','10 minuti','0','Movimenti senza dolore, senza forzare la zona lombare.','gentle mobility routine runners']]},C:{name:'Forza e controllo',warm:'10 minuti: camminata, mobilità e prove leggere dei movimenti.',cool:'5–10 minuti di camminata e mobilità dolce.',items:[['Step-up basso','3','8 per gamba','0','Gradino stabile e basso; controlla la discesa.','low step up exercise technique'],['Trazioni assistite','3','2–4','0','Usa assistenza se necessaria; evita negative lente se non le tolleri.','assisted pull up proper form'],['Floor press con manubri','3','10','','Schiena appoggiata, movimento controllato, carico leggero.','dumbbell floor press proper form'],['Split squat assistito','2','8 per gamba','0','Usa un sostegno per l’equilibrio, ampiezza confortevole.','supported split squat proper form'],['Bird dog','3','8 per lato','0','Evita di ruotare il bacino o inarcare la schiena.','bird dog exercise technique'],['Calf raise','3','15','0','Sali e scendi lentamente, appoggiandoti se serve.','standing calf raise proper form']]} };
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Salvataggio non riuscito: esporta i dati e controlla lo spazio del browser.')}}function show(p){page=p;render();scrollTo(0,0)}function start(t){type=t;draft={};show('session')}function datestr(d=new Date()){return d.toLocaleDateString('it-IT')}function render(){let html='';if(page==='home'){const n=state.sessions.length;html=`<div class="card"><div class="muted">IL TUO PERCORSO</div><h2>Riprendi con gradualità</h2><div class="grid"><div><div class="stat">${n}</div><div class="muted">Sedute registrate</div></div><div><div class="stat">${state.week}/4</div><div class="muted">Settimana impostata</div></div></div><p class="notice">Zona lombare sensibile ai carichi elevati: lavora con margine (circa 3–4 ripetizioni disponibili), evita dolore e non cercare massimali. Se compaiono sintomi persistenti, confrontati con un professionista sanitario.</p></div><h2>Scegli la seduta</h2>${Object.keys(workouts).map(t=>`<div class="card line"><div><b>${t} · ${workouts[t].name}</b><div class="muted">${t==='B'?'Corsa facile e mobilità':'Forza, controllo e stabilità'}</div></div><button onclick="start('${t}')">Apri</button></div>`).join('')}<p class="muted">Suggerimento: A – riposo – B – riposo – C. Nella settimana 1 puoi eseguire solo 2 serie degli esercizi di forza. La progressione va adattata ai sintomi e al recupero.</p>`}if(page==='session'){let w=workouts[type];html=`<div class="line"><h2>${type} · ${w.name}</h2><select style="width:100px" onchange="type=this.value;draft={};render()">${Object.keys(workouts).map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select></div><div class="card"><b>Riscaldamento</b><p>${w.warm}</p></div><div class="card"><h3>Esercizi nell'ordine</h3>${w.items.map((e,i)=>`<section class="ex"><div class="line"><b>${i+1}. ${e[0]}</b><span class="pill">${e[1]} × ${e[2]}</span></div><p class="muted">${e[4]}</p><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[5])}" target="_blank" rel="noopener">▶ Cerca dimostrazione su YouTube</a><div class="small muted" style="margin-top:9px">Registra ogni serie: ripetizioni (o minuti/secondi per gli esercizi a tempo) e kg per singolo manubrio, se usato.</div>${Array.from({length:Number(e[1])},(_,j)=>{let k=i+'-'+j;let v=draft[k]||{};return `<div class="sets"><span class="muted">${j+1}.</span><input aria-label="Ripetizioni o durata serie ${j+1}" placeholder="Rip/durata" value="${esc(v.reps??'')}" oninput="change('${k}','reps',this.value)"><input type="number" min="0" step="0.5" aria-label="Chilogrammi serie ${j+1}" placeholder="kg" value="${esc(v.kg??e[3])}" oninput="change('${k}','kg',this.value)"><button class="${v.done?'check':'secondary'}" onclick="toggle('${k}')">${v.done?'✓':'○'}</button></div>`}).join('')}</section>`).join('')}</div><div class="card"><b>Defaticamento</b><p>${w.cool}</p><label>Difficoltà percepita (1–10)</label><select id="rpe">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${i===5?'selected':''}>${i+1}</option>`).join('')}</select><label>Note (schiena, ginocchio, energia, tempo di corsa)</label><textarea id="notes" rows="3" placeholder="Come è andata?"></textarea><button style="width:100%;margin-top:14px" onclick="finish()">Salva seduta</button></div>`}if(page==='history'){html=`<h2>Diario allenamenti</h2>${state.sessions.length?state.sessions.slice().reverse().map(s=>`<div class="card"><div class="line"><b>${esc(s.type)} · ${esc(workouts[s.type]?.name)}</b><span class="muted">${esc(s.date)}</span></div><p class="muted">Difficoltà ${esc(s.rpe)}/10 · ${Object.values(s.sets).filter(x=>x.done).length} serie segnate</p>${s.notes?`<p>${esc(s.notes)}</p>`:''}<details><summary>Dettaglio serie</summary>${Object.entries(s.sets).filter(([k,v])=>v.done).map(([k,v])=>`<div class="small">${esc(workouts[s.type].items[Number(k.split('-')[0])][0])}: ${esc(v.reps||'—')} · ${esc(v.kg||'0')} kg</div>`).join('')}</details></div>`).join(''):'<div class="card">Non hai ancora salvato sedute.</div>'}<h2>Misurazioni</h2>${state.measurements.slice().reverse().map(m=>`<div class="card line"><span>${esc(m.date)}</span><b>${esc(m.weight)} kg</b><span>${esc(m.waist||'—')} cm vita</span></div>`).join('')}`;}if(page==='food'){html=`<h2>Alimentazione sostenibile</h2><div class="card"><b>Indicazioni, non dieta clinica</b><p>Non serve introdurre la colazione se stai bene senza. A mensa: una porzione adeguata di proteine, verdura, pane secondo fame e attività; considera che i sughi ricchi aumentano l'energia del piatto.</p><p>A cena: alterna carne, pesce, uova e legumi, aggiungi verdure e carboidrati soprattutto quando ti alleni. Uno yogurt greco/skyr e un frutto sono uno spuntino facoltativo.</p><p>Proteine: riferimento indicativo 125–145 g al giorno, da personalizzare. Evita tagli calorici aggressivi; monitora l'andamento di peso e vita per 2–3 settimane.</p><p>Bevande zero: apporto calorico generalmente trascurabile. Limita l'alcol e cura idratazione e sonno.</p></div><div class="card"><h3>Registra una misurazione</h3><label>Peso (kg)</label><input id="weight" type="number" step="0.1" min="20" placeholder="90"><label>Circonferenza vita (cm), facoltativa</label><input id="waist" type="number" step="0.1" min="30" placeholder="Misura sempre nello stesso punto"><button style="margin-top:12px" onclick="measure()">Salva misurazione</button></div>`}if(page==='settings'){html=`<h2>Dati e sicurezza</h2><div class="card"><p>I dati sono salvati <b>solo in questo browser su questo iPhone</b>. Non vengono inviati a un server. Se cancelli i dati del sito, potresti perderli: esporta regolarmente un backup.</p><label>Settimana corrente</label><select onchange="state.week=Number(this.value);save();render()">${[1,2,3,4].map(x=>`<option value="${x}" ${x===state.week?'selected':''}>${x}</option>`).join('')}</select><p class="muted">1: familiarizzazione; 2: avvicinati alle serie previste; 3: aumenta lievemente le ripetizioni se ben tollerate; 4: consolida senza massimali.</p><button onclick="backup()">Esporta backup JSON</button> <label class="btn secondary" style="display:inline-block;color:white;cursor:pointer">Importa backup<input type="file" accept="application/json" onchange="restore(event)" style="display:none"></label></div><div class="card"><h3>Installazione iPhone</h3><p>Per usarla come app, pubblica questa pagina su un sito HTTPS, aprila con Safari e scegli Condividi → Aggiungi alla schermata Home. Aprire un file HTML locale non garantisce la conservazione dei dati.</p><p class="muted">Nessuna notifica automatica in questa versione. Puoi creare tre promemoria settimanali nell'app Promemoria di iOS.</p></div><div class="card"><button class="outline" onclick="if(confirm('Eliminare tutti i dati salvati?')){state={sessions:[],measurements:[],week:1};save();render()}">Elimina tutti i dati</button></div>`}document.getElementById('app').innerHTML=html+'<div class="bottom"></div>'}function change(k,f,v){draft[k]??={};draft[k][f]=v}function toggle(k){draft[k]??={};draft[k].done=!draft[k].done;render()}function finish(){if(!Object.values(draft).some(x=>x.done)){alert('Segna almeno una serie completata prima di salvare.');return}state.sessions.push({date:datestr(),timestamp:Date.now(),type,sets:JSON.parse(JSON.stringify(draft)),rpe:document.getElementById('rpe').value,notes:document.getElementById('notes').value});save();draft={};show('history')}function measure(){const weight=document.getElementById('weight').value,waist=document.getElementById('waist').value;if(!weight||Number(weight)<=0){alert('Inserisci un peso valido');return}state.measurements.push({date:datestr(),weight,waist});save();show('history')}function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='allenamento-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restore(e){let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.sessions)||!Array.isArray(x.measurements))throw Error();if(confirm('Sostituire tutti i dati con questo backup?')){state=x;save();show('home')}}catch(e){alert('File di backup non valido')}}render();
</script></body></html>
